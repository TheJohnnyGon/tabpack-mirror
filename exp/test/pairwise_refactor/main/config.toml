seed = 0
n_models = 4
batch_size = 256
n_epochs = 2
patience = 4
amp_dtype = "bfloat16"
save_all_predictions = false
save_final_predictions = true
track_online_ensemble_history = true
track_experiments = true
save_model = true

[data]
path = "data/peru"
num_policy = "noisy-quantile"
num_memory_efficient = false 
extract_bin_from_num = true
skip_bin_encoder = true 
bin_policy = "convert-to-cat"
cache = false

[optimizer]
type = "MuonAdamWPack"
shared_step = true

[online_ensembles.greedy]
type = "greedy"
update_type = "latest"
include_current_ensemble_in_pool = true
patience = 2

[online_ensembles.greedy.options]
max_ensemble_size = 4

[model]
activation = "SiLU"
d_block = 128

[sampler]
type = "RandomSampler"

[sampler.space.model]
n_blocks = ["_tune_", "int", 1, 2]
dropout = ["_tune_", "?uniform", 0.0, 0.0, 0.3]

[sampler.space.optimizer]
lr = ["_tune_", "loguniform", 0.0001, 0.005]
weight_decay = ["_tune_", "loguniform", 0.001, 1.0]
muon_lr = ["_tune_", "loguniform", 0.001, 0.1]

# Pairwise loss configuration (optional, defaults to BCE)
[pairwise]
loss = "bce"

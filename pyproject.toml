[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tabpack-ag"
version = "0.0.1"
requires-python = "==3.12.9"
# The main dependencies used by the main code (bin, lib, etc.)
# and affecting results of experiments.
dependencies = [
    "delu==0.0.26",
    "loguru==0.7.3",
    "numpy==2.3.1",
    "optuna==4.4.0",
    "rtdl_num_embeddings==0.0.12",
    "rtdl_revisiting_models==0.0.2",
    "scikit-learn==1.7.0",
    "scipy==1.16.0",
    "tabm==0.0.3",
    "tensorboard==2.19.0",
    "tomli-w==1.2.0",
    "torch==2.7.1",
    "tqdm==4.67.1",
]

# Optional dependencies are also used by the main code, but are disabled by default.
# They can be useful for experiments requiring additional (heavy) dependencies
# that are not needed for the rest of the project.
[project.optional-dependencies]
# jax = ["jax==X.Y.Z", ...]
# tensorflow = ["tensorflow==X.Y.Z", ...]

# Additional dependencies for the project development.
# If any of them (say, pandas) starts being used in the main code (bin, lib, etc.),
# then it should be moved to the `dependencies` list above.
[dependency-groups]
dev = [
    "bokeh>=3.7.3,<4",
    "cyclopts>=3.21.0",
    "holoviews>=1.20.2,<2",
    "hvplot>=0.11.3,<1",
    "ipdb>=0.13.13,<1",
    "ipython>=9.3.0,<10",
    "ipywidgets>=8.1.7,<9",
    "jupyterlab>=4.4.3,<5",
    "matplotlib>=3.10.3,<4",
    "mypy>=1.16.1,<2",
    "nbclassic>=1.3.1,<2",
    "notebook>=7.4.3,<8",
    "pandas>=2.3.0,<3",
    "panel>=1.7.1,<2",
    "plotnine>=0.14.5,<1",
    "polars>=1.30.0,<2",
    "pudb>=2025.1",
    "pytest>=8.4.0,<9",
    "ruff>=0.12.0,<1",
    "seaborn>=0.13.2,<1",
    "setuptools>=80.9.0",
]
yandex_nirvana_dl = [
    "nirvana-dl==7135262",
    "yandex-global-state-controller==1.2.1",
]
yandex = [
    "cyclopts>=3.21.0,<4",
    "nirvana-api==2.5.0.post15825108",
    "nirvana-context",
    "vh3==1.0.0.dev16116338",
    "yandex-snooper",
    "yandex-yt==0.15.4",
]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^local/*", "^vendor/*"]

[tool.pyright]
exclude = [
    # Default rules
    '**/node_modules',
    '**/__pycache__',
    '**/.*',
    # Custom rules
    "cache",
    "data",
    "local",
    "vendor",
    "**/exp",
]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
extend-exclude = ["vendor/**/*.py"]

[tool.ruff.lint]
extend-select = ["RUF", "UP", "E501", "E731"]

[tool.ruff.format]
quote-style = "single"

[tool.setuptools]
packages = ["lib", "bin", "bin.tabpack", "dev", "vendor"]

[tool.uv]
conflicts = [[{ group = "dev" }, { group = "yandex" }]]
default-groups = ["dev", "yandex_nirvana_dl"]
package = true

[[tool.uv.index]]
name = "yandex"
url = "https://pypi.yandex-team.ru/simple"
explicit = true

[tool.uv.sources]
nirvana-api = { index = "yandex" }
nirvana-context = { index = "yandex" }
nirvana-dl = { index = "yandex" }
vh3 = { index = "yandex" }
yandex-global-state-controller = { index = "yandex" }
yandex-snooper = { index = "yandex" }
yandex-yt = { index = "yandex" }
yandex-yt-yson-bindings = { index = "yandex" }
